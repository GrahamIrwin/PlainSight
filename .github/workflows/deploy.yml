name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # weekly (Monday), picks up newly released cards
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write # each deploy's own commit (below)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # numpy: build_prices.py works out every day's estimated prices with it
      - run: python3 -m pip install --break-system-packages numpy
      - run: python3 tests/test_build_index.py && python3 tests/test_build_decks.py && python3 tests/test_build_prices.py && node --test
      - run: python3 scripts/build_index.py
      # Similar decks, from the corpus that "Crawl decks" keeps on the deck-corpus release, with the
      # tournament results it keeps there too. Without the corpus the card search still deploys;
      # only the deck pages are missing. Without the results, commander pages have none.
      - run: |
          gh release download deck-corpus --dir data --pattern 'decks-[0-9]*.jsonl.gz' --pattern decks-cards.json
          gh release download deck-corpus --dir data --pattern results.jsonl.gz || echo "No tournament results yet"
          python3 scripts/build_decks.py build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
      # Prices, from the history "Crawl decks" keeps on the price-history release. Without it the
      # Prices tab and card details' price charts are missing; everything else deploys
      - run: |
          gh release download price-history --dir data --pattern prices.jsonl.gz
          gh release download price-history --dir data --pattern goldfish.jsonl.gz || echo "No estimates between our days yet"
          python3 scripts/build_prices.py site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
      # Pages deploys a commit once: deploying it again (the crawl's deploys, the weekly one, Run
      # workflow) reports success and changes nothing. So each deploy is of a commit of its own, this
      # one's files in a new commit on top of it that no branch points to (Pages takes any commit the
      # repository has). actions/deploy-pages always deploys the run's commit, so the last step does
      # what it does, with this one.
      - id: version
        run: |
          sha=$(gh api repos/$GITHUB_REPOSITORY/git/commits -f message="Deploy (run $GITHUB_RUN_ID)" -f tree=$(git rev-parse 'HEAD^{tree}') -f "parents[]=$GITHUB_SHA" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      # Pages lets browsers reuse a file for 10 minutes, so a new index.html could run an old
      # cached app.js (or a new app.js an old deck.js). Each deploy's scripts get their own URLs.
      - run: sed -i -E "s/\.js\"/.js?v=${SHA::8}\"/" site/index.html site/app.js
        env:
          SHA: ${{ steps.version.outputs.sha }}
      - id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # Then, as Pages has reported success while the site stayed as it was, it waits for the site to
      # serve this deploy's index.html (Pages' CDN keeps a file up to 10 minutes)
      - id: deployment
        timeout-minutes: 30
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$token"
          url=$(gh api repos/$GITHUB_REPOSITORY/pages/deployments -F artifact_id=$ARTIFACT -f pages_build_version=$SHA -f oidc_token=$token --jq .page_url)
          echo "page_url=$url" >> "$GITHUB_OUTPUT"
          while sleep 10; do
            status=$(gh api repos/$GITHUB_REPOSITORY/pages/deployments/$SHA --jq .status || true)
            echo "$status"
            case $status in succeed) break ;; deployment_*failed|deployment_cancelled|deployment_lost) exit 1 ;; esac
          done
          until curl -sf "$url" | grep -q "v=${SHA::8}"; do sleep 30; done
          echo "$url serves this deploy"
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.upload.outputs.artifact_id }}
          SHA: ${{ steps.version.outputs.sha }}
